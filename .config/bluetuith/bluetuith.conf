{
  keybindings: {
    // Navigation - vim hjkl
    NavigateUp: k
    NavigateDown: j
    NavigateRight: l
    NavigateLeft: h

    // Page top/bottom - vim gg/G style (best available)
    NavigateTop: g
    NavigateBottom: G

    // App
    Quit: q
    Close: Escape
    Help: ?

    // Device actions (these stay mostly the same since they're single letters)
    DeviceInfo: i
    DeviceRemove: d
    DevicePair: p
    DeviceTrust: t
    DeviceAudioProfiles: A
    DeviceSendFiles: f
    DeviceNetwork: n

    // Adapter
    AdapterTogglePower: o
    AdapterToggleScan: s

    // File browser vim-style
    FilebrowserDirForward: l
    FilebrowserDirBack: h
    FilebrowserSelect: Space
    FilebrowserSelectAll: A
    FilebrowserToggleHidden: zh
  }
}
