source = ~/.cache/wal/colors-hyprland.conf
# remove this line to remove the warning
permission = /usr/(bin|local/bin)/hyprpm, plugin, allow
# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

env = GTK_USE_PORTAL,1

###############e
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
#monitor=,preferred,auto,auto
monitor=eDP-1,3840x2160@60,0x0,2
monitor=HDMI-A-1,1920x1080@144,1920x0,1
workspace = 1, monitor:HDMI-A-1
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1
workspace = 5, monitor:HDMI-A-1
workspace = 6, monitor:eDP-1
workspace = 7, monitor:eDP-1
workspace = 8, monitor:eDP-1
workspace = 9, monitor:eDP-1
workspace = 10, monitor:eDP-1

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
#terminal = kitty
#fileManager = dolphin
#menu = rofi -show drun


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = nm-applet &
# exec-once = wl-paste --watch wl-copy --primary
# exec-once = wl-paste --primary --watch wl-copy
exec-once = wl-clip-persist --clipboard both
exec-once = hyprlock || hyprctl dispatch exit --immediate
exec-once = sh -c "sleep 1 && waybar"
exec-once = swww-daemon & wal -R
exec-once = [workspace 1 silent] firefox
exec-once = com.discordapp.Discord
exec-once = clipse -listen
exec-once = sleep 2 && spotify-launcher
#exec-once = sh -c "sleep 5 && spotify-launcher -- --password-store=basic"
# exec-once = [workspace 3 silent] sh -c 'sleep 1 && kitty -e sh -c "fastfetch; exec zsh"
exec-once = hyprsunset -t 5000
exec-once = hypridle
exec-once = mako
exec-once = fcitx5
exec-once = sh -c "sleep 10 && dotoold &"
exec-once = hyprctl setcursor Bibata-Modern-Ice 24


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


###################
### PERMISSIONS ###
###################

# See https://wiki.hyprland.org/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow

plugin {
	hyprscrolling {
		column_width=.7
		fullscreen_on_one_column=false
	}
  dynamic-cursors {
    tilt {
      limit = 2000
      function = quadratic
      full_tilt = 60
    }
    shake {
      enabled = false
    }
  } 
}

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/
# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 2.5
    gaps_out = 4

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = $color2
    col.inactive_border = $color8

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 0
    rounding_power = 2
    # Change transparency of focused and unfocused windows
    #active_opacity = 1
    #inactive_opacity = 1
    dim_inactive = true
    dim_strength = .05

    shadow {
        enabled = true
        range = 1
        render_power = 5
        color = rgb(256,256,256)
    #color = rgba(1a1a1aee)
    }

#	layerrule = blur,waybar
#	layerrule = blur,wofi 

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 5

        vibrancy = 0.696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    bezier = clean, 0.1,0.9,0.2,1.05
    bezier = clean2, 0,0.8,0.5,1
    bezier = clean3, 0.1, 0.9, 0.2, 1
    bezier = layerclean, 0.3,0.9,0.1,1.08

    animation = global, 1, 10, default
    animation = border, 1, 4, clean
    animation = windows, 1, 4, clean3
    #animation = windowsIn, 1, 10, clean2
    #animation = windowsOut, 1, 10, clean2
    animation = fadeIn, 1, 1.5, quick
    animation = fadeOut, 1, 1.5, quick
    animation = fadeSwitch, 0, 5, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 3, layerclean, slide
    animation = layersOut, 1, 5, layerclean, slide
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.75, clean, slide
    animation = workspacesIn, 1, 1.75, clean, slide
    animation = workspacesOut, 1, 1.75, clean, slide
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

windowrule = match:class discord, workspace 10 silent
windowrule = match:initial_title discord, workspace 10 silent
windowrule = match:class discord, no_initial_focus on
windowrule = match:initial_title discord, no_initial_focus on
windowrule = match:class discord, float on
windowrule = match:class spotify, float on
windowrule = match:class spotify-launcher, float on
windowrule = match:class spotify, workspace 10 silent
windowrule = match:class spotify-launcher, workspace 10 silent
windowrule = match:class spotify, no_initial_focus on
windowrule = match:class spotify-launcher, no_initial_focus on
windowrule = match:class discord, size 1566 954
windowrule = match:class discord, move 339 48
windowrule = match:class spotify, size 1597 938
windowrule = match:class spotify, move 27 118
windowrule = match:class org.pulseaudio.pavucontrol, float on
windowrule = match:class org.pulseaudio.pavucontrol, move 73.7% 4%
windowrule = match:class blueberry.py, float on
windowrule = match:class blueberry.py, move 65% 4%
windowrule = match:class org.gnome.Calendar, float on
windowrule = match:class org.gnome.Calendar, move 30% 4%
windowrule = match:class ibus-ui-gtk3, float on
windowrule = match:class nm-connection-editor, float on
windowrule = match:title nmtui, float on
windowrule = match:title nmtui, size 700 550
windowrule = match:title nmtui, move 62.5% 5%
windowrule = match:class nm-connection-editor, move 50% 53
windowrule = match:class anki, float on
windowrule = match:class anki, match:title 'User 1 - Anki', size 700 700
windowrule = match:class clipse, float on
windowrule = match:class clipse, size 600 800
windowrule = match:class floatingkitty, size 1600 900
windowrule = match:class floatingkitty, float on
windowrule = match:class qimgv, float on
#windowrule = match:class qimgv, size 1600 900
windowrule = match:class mpv, float on
windowrule = match:class mpv, size 1600 900
windowrule = match:class mpv, center on
windowrule = match:class yazi-filepicker, float on
windowrule = match:class yazi-filepicker, size 60% 60%
windowrule = match:class yazi-filepicker, center on
windowrule = match:class Aseprite, fullscreen on
windowrule = match:title GOOB, float on
windowrule = match:title FilePicker, float on
windowrule = match:title FilePicker, size 1200 800
layerrule = match:namespace launcher, blur on
layerrule = match:namespace launcher, dim_around on
layerrule = match:namespace launcher, animation slide top 
layerrule = match:namespace swaync-control-center, animation slide left
layerrule = match:namespace selection, animation fade
layerrule = match:namespace hyprpicker, animation fade
layerrule = match:namespace waybar, animation popin
# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    focus_on_activate = true
    animate_mouse_windowdragging = false
    close_special_on_empty = true
#    new_window_takes_over_fullscreen = 2
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =

    kb_rules =
    repeat_rate = 50
    repeat_delay = 300
    follow_mouse = 1
    #kb_options = caps:swapescape
    
    sensitivity = .4 # -1.0 - 1.0, 0 means no modification.
    accel_profile = flat
    touchpad {
        natural_scroll = true
	scroll_factor = .5
	disable_while_typing = true
	tap_button_map = lrm
	drag_lock = 2
	tap-and-drag = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
#    workspace_swipe = true
#    workspace_swipe_fingers = 4
gesture = 4, horizontal, workspace
gesture = 3, swipe, move
gesture = 3, swipe, mod:CTRL, resize
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

device {
    name = sonix-aula-s75pro*
  kb_options =
}

device {
  name = at-translated-set-2-keyboard
  kb_options = caps:swapescape
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
#bind = $mainMod, c, exec, kitty -e sh -c 'fastfetch; exec zsh'https://github.com/KZDKM/Hyprspace.git
#bind = $mainMod, tab, overview:toggle
bind = $mainMod, c, exec, kitty
bind = $mainMod SHIFT, c, exec, kitty --class floatingkitty
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, M, exit,
bind = $mainMod, E, exec, kitty zsh -c 'tmp=$(mktemp); yazi "$@" --cwd-file="$tmp"; [ -f "$tmp" ] && cd "$(cat "$tmp")"; rm -f "$tmp"; exec zsh'
#bind = $mainMod, E, exec, kitty -e sh -c 'yazi; exec zsh'
#bind = $mainMod, y, exec, dolphin
bind = $mainMod, T, exec, kitty "btop"
bind = $mainMod, D, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, H, togglesplit, # dwindle
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod, B, exec, firefox -P "Personal"
bind = $mainMod SHIFT, B, exec, firefox -P "School"
bind = $mainMod, R, exec, Scripts/./randomize.sh
bind = alt, space, exec, fuzzel
bind = $mainMod, bracketleft, exec, ~/.config/waybar/swaptheme.sh
bind = $mainMod, escape, exec, swaync-client -t -sw
bind = $mainMod, N, exec, hyprlock || hyprctl dispatch exit
bind = $mainMod, bracketright, exec, waybar
bind = $mainMod, backslash, exec, pkill waybar
bind = CONTROL SHIFT, 1, exec, /home/rasberry/Scripts/monitor-only.sh
bind = CONTROL SHIFT, 2, exec, /home/rasberry/Scripts/laptop-monitor.sh
bind = CONTROL SHIFT, 3, exec, /home/rasberry/Scripts/laptop-only.sh
bind = CONTROL SHIFT, 4, exec, /home/rasberry/Scripts/caps-off.sh
bind = CONTROL, l, resizeactive, 30 0
bind = CONTROL, h, resizeactive, -30 0
bind = CONTROL, k, resizeactive, 0 -30
bind = CONTROL, j, resizeactive, 0 30
binde = $mainMod SHIFT, l, movewindow, 30 0
binde = $mainMod SHIFT, h, movewindow, -30 0
binde = $mainMod SHIFT, k, movewindow, 0 -30
binde = $mainMod SHIFT, j, movewindow, 0 30

#bind = $mainMod, V, exec, cliphist list | fuzzel --dmenu --with-nth 2 | cliphist decode | wl-copy
bind = SUPER, V, exec,  kitty --class clipse -e 'clipse'
# Move focus with mainMod + arrow keys
bind = $mainMod, j, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, i, movefocus, u
bind = $mainMod, k, movefocus, d
bind = $mainMod, l, alterzorder, top
bind = $mainMod, j, alterzorder, top
bind = $mainMod, i, alterzorder, top
bind = $mainMod, k, alterzorder, top
bind = $mainMod, COMMA, exec, echo wheel 1 | dotoolc
bind = $mainMod SHIFT, COMMA, exec, echo wheel 3 | dotoolc
bind = $mainMod, PERIOD, exec, echo wheel -1 | dotoolc
bind = $mainMod SHIFT, PERIOD, exec, echo wheel -3 | dotoolc
# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, U, workspace, e-1
bind = $mainMod, O, workspace, e+1
bind = $mainMod SHIFT, U, exec, \
  hyprctl dispatch workspace $((($(hyprctl activeworkspace -j | jq .id) + 8) % 10 + 1))
bind = $mainMod SHIFT, O, exec, \
  hyprctl dispatch workspace $((($(hyprctl activeworkspace -j | jq .id) % 10) + 1))
#bind = SUPER, Tab, overview:toggle
bind = $mainMod SHIFT, R, exec, ~/Scripts/way-wall.sh
#bind = $mainMod SHIFT, l, resizeactive, 25 0
#bind = $mainMod SHIFT, j, resizeactive, -25 0
#bind = $mainMod SHIFT, i, resizeactive, 0 -25
#bind = $mainMod SHIFT, k, resizeactive, 0 25

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Screenshot
bind = $mainMod_SHIFT, S, exec, hyprshot -m region --freeze --clipboard-only --silent
bind = $mainMod, PRINT, exec, hyprshot -m output --clipboard-only
#bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -

# Example special workspace (scratchpad)
bind = $mainMod, W, togglespecialworkspace, magic
bind = $mainMod SHIFT, W, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
#bind = $mainMod, mouse_down, workspace, e+1
#bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod SHIFT, mouse:272, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

